<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Wana.Work</title>
    <meta name="description" content="Thanks for reaching out. The Wana.Work team will get back to you shortly.">
    <meta name="robots" content="noindex">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #1F2937;
            background: #FFFFFF;
            line-height: 1.6;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            padding: 1rem 2rem;
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-size: 1.25rem;
            font-weight: 800;
            color: #6366F1;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            color: #4B5563;
            text-decoration: none;
            font-size: 0.9375rem;
            font-weight: 500;
        }

        .thank-you {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 6rem 2rem 4rem;
        }

        .check-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #ECFDF5;
            border: 2px solid #10B981;
            color: #047857;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .thank-you h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #1E1B4B;
            letter-spacing: -0.02em;
        }

        .thank-you p {
            font-size: 1.125rem;
            color: #4B5563;
            max-width: 520px;
            margin-top: 0.75rem;
        }

        .btn-home {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.875rem 2rem;
            background: linear-gradient(135deg, #FF6B4A, #A855F7, #6366F1);
            color: #FFFFFF;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9375rem;
        }

        .btn-home:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="/" class="nav-logo">Wana.Work</a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/platform">Features</a></li>
                <li><a href="/pricing">Pricing</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section class="thank-you">
        <div class="check-icon">&#10003;</div>
        <h1>Thank you!</h1>
        <p>We've received your details and our team will get back to you shortly &mdash; usually within one business day.</p>
        <a href="/" class="btn-home">Back to Home</a>
    </section>
</body>
</html>
